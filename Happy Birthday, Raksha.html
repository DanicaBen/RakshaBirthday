.scrim {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: linear-gradient(to bottom, rgba(8, 10, 34, .5), rgba(8, 10, 34, .3) 38%, rgba(8, 10, 34, .7));
  transition: background .9s ease;
}
body.lights-out .scrim {
  background: linear-gradient(to bottom, rgba(6, 8, 26, .66), rgba(6, 8, 26, .5) 40%, rgba(6, 8, 26, .8));
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 40rem;
  margin-inline: auto;
  padding-inline: 1rem;
  padding-block: clamp(2rem, 6vw, 4rem) 4rem;
  display: grid;
  gap: clamp(2rem, 6vw, 3.25rem);
  overflow-x: clip;
}

h1, h2 {
  font-family: var(--font-display);
  font-weight: 400;
  text-wrap: balance;
}
h1 {
  font-size: clamp(2.4rem, 9.5vw, 3.9rem);
  line-height: 1.04;
  max-width: 13ch;
  text-shadow: 0 2px 22px rgba(8, 10, 34, .85);
}
.lede {
  margin-top: .9rem;
  max-width: 30rem;
  font-size: 1.15rem;
  color: var(--glow);
  text-shadow: 0 1px 14px rgba(8, 10, 34, .9);
  text-wrap: pretty;
}

/* ---------- Cake ---------- */
.stage {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 1.1rem;
  --lit: 1;
}
.halo {
  position: absolute;
  left: 50%;
  top: 24%;
  width: min(130%, 600px);
  aspect-ratio: 1;
  transform: translate(-50%, -40%);
  background: radial-gradient(circle, rgba(255, 214, 120, .3), transparent 62%);
  opacity: var(--lit);
  transition: opacity .9s ease;
  pointer-events: none;
}
.cake {
  position: relative;
  width: min(100%, 460px);
  height: auto;
  overflow: visible;
  filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .45));
}
.cake text { font-family: var(--font-display); }

.slab { transform-box: fill-box; transform-origin: 50% 100%; }
.knife { opacity: 0; pointer-events: none; }

#candles { transition: opacity .45s ease, transform .45s ease; }
#candles.gone { opacity: 0; transform: translateY(-8px); pointer-events: none; }

.candle { cursor: pointer; }
.candle:focus { outline: none; }
.candle:focus-visible .hit { stroke: var(--amber); stroke-width: 2; }
.glow { transition: opacity .5s ease; }
.flame {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: flick 1.5s ease-in-out infinite alternate;
  animation-delay: var(--d, 0s);
  transition: opacity .3s ease, transform .3s ease;
}
.candle.out .flame { opacity: 0; transform: scale(.1); animation: none; }
.candle.out .glow { opacity: 0; }
.smoke circle {
  fill: #B9C0E6;
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
}
.candle.out .smoke circle { animation: puff 1.8s ease-out forwards; }
.candle.out .smoke circle:nth-child(2) { animation-delay: .25s; }

@keyframes flick {
  0%   { transform: scale(1, 1) rotate(-2deg); }
  50%  { transform: scale(.93, 1.07) rotate(1.5deg); }
  100% { transform: scale(1.04, .95) rotate(-1deg); }
}
@keyframes puff {
  0%   { opacity: .75; transform: translateY(0) scale(.5); }
  100% { opacity: 0; transform: translateY(-30px) scale(1.7); }
}

.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: .6rem 1.1rem;
}
.btn {
  appearance: none;
  border: 0;
  border-radius: 10px;
  padding: .75rem 1.3rem;
  background: var(--cream);
  color: var(--night);
  font: 600 1.05rem/1 var(--font-body);
  cursor: pointer;
}
.btn:hover { background: var(--glow); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost {
  background: transparent;
  color: var(--cream);
  border: 1.5px solid rgba(248, 235, 208, .55);
}
.btn.ghost:hover { background: rgba(248, 235, 208, .12); }
.btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
.status {
  font-variant-numeric: tabular-nums;
  color: var(--glow);
  text-shadow: 0 1px 12px rgba(8, 10, 34, .9);
}
.wish {
  min-height: 3.4em;
  max-width: 24rem;
  text-align: center;
  font-family: var(--font-display);
  font-size: 1.35rem;
  line-height: 1.3;
  text-shadow: 0 1px 16px rgba(8, 10, 34, .95);
  text-wrap: balance;
}

/* ---------- Pictures ---------- */
.pics-head h2 {
  font-size: clamp(1.8rem, 6vw, 2.5rem);
  line-height: 1.1;
  text-shadow: 0 2px 18px rgba(8, 10, 34, .9);
}
.pics-head p {
  margin-top: .4rem;
  color: var(--glow);
  text-shadow: 0 1px 12px rgba(8, 10, 34, .9);
}

.slides { display: grid; gap: clamp(2.75rem, 8vw, 4.25rem); }

.slide {
  --tilt: -1.4deg;
  width: min(100%, 22rem);
  padding: .9rem .9rem 0;
  background: var(--cream);
  color: var(--cocoa);
  box-shadow: 0 16px 28px rgba(0, 0, 0, .5);
  transform: rotate(var(--tilt));
  justify-self: start;
  margin-left: 2%;
}
.slide:nth-child(even) {
  --tilt: 1.2deg;
  justify-self: end;
  margin-left: 0;
  margin-right: 2%;
}
.slide:nth-child(3n) { --tilt: -.6deg; }

.pic {
  position: relative;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: var(--night);
}
.pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ph {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .7rem;
  background: radial-gradient(circle at 50% 38%, #3A4592, #1B2255 70%);
  color: var(--glow);
  font-family: var(--font-hand);
  font-size: 1.3rem;
  text-align: center;
}
.ph svg { width: 3rem; height: 3rem; filter: drop-shadow(0 0 10px rgba(255, 214, 120, .8)); }

.cap {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: .75rem;
  padding: .85rem .25rem 1.1rem;
}
.cap p {
  font-family: var(--font-hand);
  font-weight: 700;
  font-size: 1.65rem;
  line-height: 1.12;
  text-wrap: balance;
}
.cap .n {
  flex: none;
  font-size: .8rem;
  font-variant-numeric: tabular-nums;
  color: var(--cocoa-soft);
}

.closing {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 5vw, 2rem);
  line-height: 1.2;
  max-width: 16ch;
  text-wrap: balance;
  text-shadow: 0 2px 20px rgba(8, 10, 34, .9);
}

.chip {
  position: fixed;
  z-index: 5;
  right: max(1rem, env(safe-area-inset-right, 0px));
  bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  padding: .35rem .85rem;
  border: 1px solid rgba(248, 235, 208, .3);
  border-radius: 999px;
  background: #0A0E2B;
  color: var(--cream);
  font-weight: 600;
  font-size: .95rem;
  letter-spacing: .06em;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 479px) {
  .slide, .slide:nth-child(even) { width: 88%; }
}

@media (prefers-reduced-motion: reduce) {
  .flame { animation: none; }
  .candle.out .smoke circle { animation: none; }
  .scrim, .halo, .glow, .flame, #candles { transition: none; }
}
</style>

<div class="sky" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>

<div class="wrap">
  <header id="top">
    <h1>Happy birthday, Rakshaaaaaa. You're getting old now hehe.</h1>

  <section class="stage" id="stage" aria-label="Birthday cake">
    <div class="halo" aria-hidden="true"></div>

    <svg class="cake" viewBox="0 40 360 270" role="img" aria-label="A layered cake with candles that says Raksha">
      <defs>
        <radialGradient id="glow">
          <stop offset="0" stop-color="#FFD678" stop-opacity=".6"/>
          <stop offset="1" stop-color="#FFD678" stop-opacity="0"/>
        </radialGradient>
        <pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
          <rect width="8" height="4" fill="#F6B23C"/>
        </pattern>
      </defs>

      <!-- table plate and the two side plates -->
      <ellipse cx="180" cy="290" rx="172" ry="13" fill="#2A3374"/>
      <ellipse cx="180" cy="287" rx="172" ry="13" fill="#3A4592"/>
      <ellipse cx="38" cy="284" rx="34" ry="8" fill="#F8EBD0"/>
      <ellipse cx="322" cy="284" rx="34" ry="8" fill="#F8EBD0"/>

      <!-- inside of the cake, visible where a slice has gone -->
      <rect x="70" y="138" width="220" height="142" rx="4" fill="#5C4328"/>

      <g id="candles"></g>

      <g class="knife" id="knife">
        <path d="M-3,-120 L3,-120 L3,-8 L0,0 L-3,-8 Z" fill="#DDE3F5"/>
        <rect x="-9" y="-124" width="18" height="5" rx="2" fill="#8E96C2"/>
        <rect x="-5" y="-172" width="10" height="50" rx="4" fill="#3B2A1D"/>
        <circle cx="0" cy="-160" r="1.8" fill="#F6B23C"/>

      <button class="btn" id="main" type="button">Blow out the candles</button>

  <p class="closing" id="outro">Happy birthday, Raksha. Love you.</p>
</div>

<div class="chip" id="chip" hidden></div>

<script>
// Photos: set `photo` to a published path such as "photos/01.jpg". `pos` nudges the crop, e.g. "50% 20%".
var REASONS = [
  { t: "You might look like a goddamn princess", photo: "photos/princess.jpeg" },
  { t: "But you're still a cutie pie", photo: "photos/cute.jpeg" },
  { t: "Specifically, my cutie pie", photo: "photos/mine.jpeg" },
  { t: "Throughout your quirkiness", photo: "photos/quirky.jpeg" },
  { t: "You made my sad self happy", photo: "photos/us.jpeg" },
  { t: "From KPR", photo: "photos/kpr.jpeg" },
  { t: "Amrita", photo: "photos/amrita.jpeg" },
  { t: "Pongal", photo: "photos/pongal.jpeg" },
  { t: "There's no one else I would want to spend college with", photo: "photos/bleh.jpeg"},
  { t: "I love your fashion", photo: "photos/fashion.jpeg" },
  { t: "I love your naive ahh that keeps getting in trouble", photo: "photos/qq.jpeg"},
  { t: "I love how you panic before you speak even tho you always ace it", photo: "photos/speaking.jpeg" },
  { t: "I love how you run to the elavator", photo: "photos/unicorn.jpeg" },
  { t: "I love watching you get scared of dogs", photo: "photos/flow.jpeg" },
  { t: "I love being with you", photo: "photos/flower.jpeg" },
  { t: "And while we're in this college together", photo: "photos/clg.jpeg"},
  { t: "I want to keep you happy", photo: "photos/happy.jpeg" },
  { t: "And even after, I want you to know I'm here for you", photo: "photos/here.jpeg" },
  { t: "Because it's you. Happy birthday, Bara Bara.", photo: "photos/final.jpeg" }
];

var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#FFE6A8"/></svg>';

/* ================= cake ================= */
var X0 = 70, SW = 55, NS = 4;
var CANDLE_X = [100, 127, 153, 180, 207, 233, 260];
var total = CANDLE_X.length;
var cuts = 0, busy = false;

var slabLayer = document.getElementById('slabs');
var slabHtml = '';
for (var k = 0; k < NS; k++) {
  var x = X0 + SW * k;
  var w = SW + (k < NS - 1 ? 0.7 : 0);
  var rl = k === 0 ? 10 : 0, rr = k === NS - 1 ? 10 : 0;
  var y = 138, h = 20;
  var d = 'M' + x + ',' + (y + h) + ' V' + (y + rl) + ' ' +
    (rl ? 'Q' + x + ',' + y + ' ' + (x + rl) + ',' + y : 'L' + x + ',' + y) + ' H' + (x + w - rr) + ' ' +
    (rr ? 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + rr) : 'L' + (x + w) + ',' + y) +
    ' V' + (y + h) + ' Z';
  slabHtml +=
    '<g class="slab" data-k="' + k + '">' +
      '<rect x="' + x + '" y="156" width="' + w + '" height="48" fill="#D6B07A"/>' +
      '<rect x="' + x + '" y="204" width="' + w + '" height="10" fill="#F8EBD0"/>' +
      '<rect x="' + x + '" y="214" width="' + w + '" height="40" fill="#D6B07A"/>' +
      '<rect x="' + x + '" y="254" width="' + w + '" height="8" fill="#B97A3A"/>' +
      '<rect x="' + x + '" y="262" width="' + w + '" height="18" fill="#D6B07A"/>' +
      '<rect x="' + (x + 13) + '" y="152" width="12" height="22" rx="6" fill="#F8EBD0"/>' +
      '<path d="' + d + '" fill="#F8EBD0"/>' +
    '</g>';
}
slabLayer.innerHTML = slabHtml;
var slabs = Array.prototype.slice.call(slabLayer.querySelectorAll('.slab'));

var candleLayer = document.getElementById('candles');
var cm = '';
CANDLE_X.forEach(function (cx, i) {
  var dl = (i * 0.23).toFixed(2);
  cm +=
    '<g class="candle" data-i="' + i + '" transform="translate(' + cx + ',142)" role="button" tabindex="0" aria-label="Candle ' + (i + 1) + ', lit. Press to blow it out.">' +
      '<circle class="glow" cx="0" cy="-50" r="26" fill="url(#glow)"/>' +
      '<rect x="-4" y="-34" width="8" height="34" rx="2" fill="#F8EBD0"/>' +
      '<rect x="-4" y="-34" width="8" height="34" rx="2" fill="url(#stripe)"/>' +
      '<line x1="0" y1="-34" x2="0" y2="-39" stroke="#3B2A1D" stroke-width="1.4" stroke-linecap="round"/>' +
      '<g class="flame" style="--d:' + dl + 's" transform="translate(0,-39)">' +
        '<path d="M0,-17 C5,-10 7,-4 0,1 C-7,-4 -5,-10 0,-17 Z" fill="#F6B23C"/>' +
        '<path d="M0,-9 C2.5,-5 3,-2 0,0.5 C-3,-2 -2.5,-5 0,-9 Z" fill="#FFF4D2"/>' +
      '</g>' +
      '<g class="smoke"><circle cx="0" cy="-42" r="3"/><circle cx="2" cy="-44" r="2.4"/></g>' +
      '<rect class="hit" x="-12" y="-72" width="24" height="76" rx="6" fill="transparent"/>' +
    '</g>';
});
candleLayer.innerHTML = cm;
var candles = Array.prototype.slice.call(candleLayer.querySelectorAll('.candle'));

var stage = document.getElementById('stage');
var wishEl = document.getElementById('wish');
var statusEl = document.getElementById('status');
var mainBtn = document.getElementById('main');
var picsBtn = document.getElementById('toPics');
var knife = document.getElementById('knife');

function litCount() {
  return candles.filter(function (c) { return !c.classList.contains('out'); }).length;
}

function render() {
  var lit = litCount();
  stage.style.setProperty('--lit', String(lit / total));
  document.body.classList.toggle('lights-out', lit === 0);

  if (cuts === 0) {
    statusEl.textContent = lit + ' of ' + total + ' candles lit';
    if (lit === total) wishEl.textContent = "Make a wish. Take your time.";
    else if (lit === 0) wishEl.textContent = "Wish made. Now the knife.";
    else wishEl.textContent = "Good start. Keep going.";
  } else if (cuts === 1) {
    statusEl.textContent = '1 slice served';
    wishEl.textContent = "Sorry I missed the real cake cutting. This slice is all yours.";
  } else {
    statusEl.textContent = '2 slices served';
    wishEl.textContent = "Second slice, because it's your birthday.";
  }

  if (cuts >= 2) mainBtn.textContent = 'Start over';
  else if (cuts === 1) mainBtn.textContent = 'Cut another slice';
  else if (lit === 0) mainBtn.textContent = 'Cut the cake';
  else mainBtn.textContent = 'Blow out the candles';

  mainBtn.disabled = busy;
  picsBtn.hidden = cuts === 0;
}

function setOut(c, out) {
  c.classList.toggle('out', out);
  var n = Number(c.getAttribute('data-i')) + 1;
  c.setAttribute('aria-label', 'Candle ' + n + (out ? ', blown out.' : ', lit. Press to blow it out.'));
}

function toggleCandle(c) {
  if (busy || cuts > 0) return;
  setOut(c, !c.classList.contains('out'));
  render();
}
candles.forEach(function (c) {
  c.addEventListener('click', function () { toggleCandle(c); });
  c.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCandle(c); }
  });
});

function blowAll() {
  busy = true; render();
  candles.forEach(function (c, i) {
    setTimeout(function () {
      setOut(c, true);
      if (i === candles.length - 1) busy = false;
      render();
    }, i * 110);
  });
}

function cutSlice() {
  var right = cuts === 0;
  var slab = slabs[right ? NS - 1 : 0];
  var cutX = right ? X0 + SW * (NS - 1) : X0 + SW;
  var dx = right ? 59.5 : -59.5;
  var rot = right ? 5 : -5;
  busy = true;
  candleLayer.classList.add('gone');
  render();

  var delay = cuts === 0 ? 450 : 0;
  setTimeout(function () {
    function at(y) { return 'translate(' + cutX + 'px,' + y + 'px)'; }
    knife.animate([
      { transform: at(92), opacity: 0 },
      { transform: at(100), opacity: 1, offset: 0.1 },
      { transform: at(286), opacity: 1, offset: 0.62 },
      { transform: at(286), opacity: 1, offset: 0.72 },
      { transform: at(100), opacity: 0 }
    ], { duration: 1500, easing: 'ease-in-out' });

    setTimeout(function () {
      slab.animate([
        { transform: 'translate(0px,0px) rotate(0deg)' },
        { transform: 'translate(' + (dx * 0.5) + 'px,-16px) rotate(' + (rot * 0.5) + 'deg)', offset: 0.5 },
        { transform: 'translate(' + dx + 'px,-2px) rotate(' + rot + 'deg)' }
      ], { duration: 950, easing: 'ease-in-out', fill: 'forwards' });
    }, 650);

    setTimeout(function () {
      cuts += 1;
      busy = false;
      render();
    }, 1700);
  }, delay);
}

function startOver() {
  slabs.forEach(function (s) { s.getAnimations().forEach(function (a) { a.cancel(); }); });
  candleLayer.classList.remove('gone');
  candles.forEach(function (c) { setOut(c, false); });
  cuts = 0; busy = false;
  render();
}

mainBtn.addEventListener('click', function () {
  if (busy) return;
  if (cuts >= 2) startOver();
  else if (cuts === 1) cutSlice();
  else if (litCount() === 0) cutSlice();
  else blowAll();
});
picsBtn.addEventListener('click', function () {
  var el = document.getElementById('pictures');
  try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { el.scrollIntoView(); }
});
render();

/* ================= pictures ================= */
var slidesEl = document.getElementById('slides');
var rm = '';
REASONS.forEach(function (r, i) {
  var n = String(i + 1).padStart(2, '0');
  var pic = r.photo
    ? '<img src="' + r.photo + '" alt="Raksha" loading="lazy" style="object-position:' + (r.pos || '50% 30%') + '">'
    : '<div class="ph">' + STAR + '<span>photo ' + n + ' goes here</span></div>';
  rm +=
    '<figure class="slide" data-n="' + (i + 1) + '">' +
      '<div class="pic">' + pic + '</div>' +
      '<figcaption class="cap"><p>' + r.t + '</p><span class="n">' + (i + 1) + ' / ' + REASONS.length + '</span></figcaption>' +
    '</figure>';
});
slidesEl.innerHTML = rm;

/* progress chip: shows which picture is mid-screen, hidden over the cake and the ending */
var chip = document.getElementById('chip');
try {
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      var n = e.target.getAttribute('data-n');
      if (n) {
        chip.textContent = String(n).padStart(2, '0') + ' / ' + REASONS.length;
        chip.hidden = false;
      } else {
        chip.hidden = true;
      }
    });
  }, { rootMargin: '-45% 0px -45% 0px' });
  document.querySelectorAll('.slide, #top, #stage, #outro').forEach(function (el) { io.observe(el); });
} catch (err) { /* chip stays hidden */ }
</script>
